<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Interview AI</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="auth-style.css" />
  </head>
  <body>
    <div class="auth-container">
      <div class="auth-card">
        <div class="auth-header">
          <a href="index.html" class="auth-logo">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none">
              <rect width="24" height="24" rx="6" fill="#5a4ff3" />
              <path
                d="M7 12L10 15L17 8"
                stroke="white"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            <span>Interview AI</span>
          </a>
          <h1>Welcome Back</h1>
          <p>Enter your details to continue your practice</p>
        </div>

        <form class="auth-form">
          <div class="input-group">
            <label>Email Address</label>
            <input type="email" placeholder="name@company.com" required />
          </div>
          <div class="input-group">
            <div class="label-row">
              <label>Password</label>
              <a href="#" class="forgot-link">Forgot?</a>
            </div>
            <input type="password" placeholder="••••••••" required />
          </div>
          <button type="submit" class="btn-auth">Sign In</button>
        </form>

        <div class="auth-divider">
          <span>or continue with</span>
        </div>

    <button class="btn-google">
    <img src="https://www.svgrepo.com/show/355037/google.svg" alt="Google" width="18">
    Google
</button>

        <p class="auth-footer">
          Don't have an account? <a href="signup.html">Create for free</a>
        </p>
      </div>
    </div>
  </body>
</html>
